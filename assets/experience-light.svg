<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484" role="img" aria-label="Experience, education and leadership">
  <title>Experience, education and leadership</title>
  <style>
  .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
