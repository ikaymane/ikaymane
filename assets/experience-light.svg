  <g class="up" style="animation-delay:0.00s"><line x1="72" y1="60" x2="98" y2="60" stroke="#59636e" stroke-width="1.2"/><text class="sans" x="110" y="64" font-size="12" letter-spacing="2.6" fill="#59636e">EXPERIENCE</text></g>
  <g class="up" style="animation-delay:0.15s"><circle cx="77" cy="106" r="5" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/><text class="serif" x="100" y="112" font-size="22" fill="#1f2328">Founder</text><text class="mono" x="704" y="110" font-size="12.5" text-anchor="end" fill="#59636e">Aug 2026 – Present</text><text class="sans" x="100" y="136" font-size="14" font-weight="600" fill="#1f2328">Notorify</text><text class="sans" x="100" y="162" font-size="15" fill="#59636e">Gets businesses covered in online news outlets. A journalist writes the</text><text class="sans" x="100" y="184" font-size="15" fill="#59636e">story, the client approves it, and it goes live across news sites in their</text><text class="sans" x="100" y="206" font-size="15" fill="#59636e">market, with a report on every placement.</text></g>
  <g class="up" style="animation-delay:0.30s"><circle cx="77" cy="256" r="5" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/><text class="serif" x="100" y="262" font-size="22" fill="#1f2328">Agentic AI Intern</text><text class="mono" x="704" y="260" font-size="12.5" text-anchor="end" fill="#59636e">Aug 2026 – Oct 2026</text><text class="sans" x="100" y="286" font-size="14" font-weight="600" fill="#1f2328">AiOO · Dubai, remote</text></g>
  <g class="up" style="animation-delay:0.45s"><circle cx="77" cy="340" r="5" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"/><text class="serif" x="100" y="346" font-size="22" fill="#1f2328">AI &amp; ML · AI Automation Intern</text><text class="mono" x="704" y="344" font-size="12.5" text-anchor="end" fill="#59636e">Jul 2025 – Aug 2025</text><text class="sans" x="100" y="370" font-size="14" font-weight="600" fill="#1f2328">Devoteam · Rabat</text><text class="sans" x="100" y="396" font-size="15" fill="#59636e">Shipped a multilingual AI medical assistant and a medication reminder engine</text><text class="sans" x="100" y="418" font-size="15" fill="#59636e">on n8n and LLM pipelines.</text></g>
  <g class="up" style="animation-delay:0.20s"><line x1="760" y1="60" x2="786" y2="60" stroke="#59636e" stroke-width="1.2"/><text class="sans" x="798" y="64" font-size="12" letter-spacing="2.6" fill="#59636e">EDUCATION</text></g>
