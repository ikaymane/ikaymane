  <g class="up" style="animation-delay:0.42s"><text class="serif" x="760" y="164" font-size="18" fill="#1f2328">Computer &amp; Information Sciences</text><text class="mono" x="1128" y="186" font-size="12.5" text-anchor="end" fill="#59636e">2024 – 2026</text><text class="sans" x="760" y="186" font-size="14" fill="#59636e">ENSA Al Hoceima</text></g>
