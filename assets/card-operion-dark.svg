<svg xmlns="http://www.w3.org/2000/svg" width="580" height="236" viewBox="0 0 580 236" role="img" aria-label="Operion">
  <title>Operion</title>
  <style>
  .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .up { opacity: 0; animation: up 1s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .draw { animation: draw 1.4s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
  }

  .arrow { animation: nudge 4s 1.0s ease-in-out infinite; }
  @keyframes nudge { 0%, 80%, 100% { transform: none } 90% { transform: translate(3px, -3px) } }</style>
  <rect x=".5" y=".5" width="579" height="235" rx="16" fill="#151b23" stroke="#30363d"/>
  <line x1="32" y1="0.5" x2="548" y2="0.5" stroke="#f0f6fc" stroke-width="2" stroke-dasharray="516" stroke-dashoffset="516" class="draw" style="animation-delay:0.30s"/>
  <g class="up" style="animation-delay:0.00s">
    <text class="mono" x="32" y="48" font-size="13" letter-spacing="1.4" fill="#9198a1">OCT 2026 · AMD HACKATHON ACT III</text>
    <text class="serif" x="31" y="88" font-size="30" letter-spacing="-.4" fill="#f0f6fc">Operion</text>
    <g class="arrow"><path d="M530,52 L546,36 M534,36 H546 V48" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="sans" x="32" y="126" font-size="16" fill="#9198a1">Predictive maintenance copilot that flags equipment issues</text><text class="sans" x="32" y="149" font-size="16" fill="#9198a1">before they turn into downtime. Built in a team of four.</text>
    <text class="mono" x="32" y="206" font-size="14" letter-spacing=".2" fill="#9198a1">Python  ·  AI  ·  Hackathon</text>
  </g>
</svg>
