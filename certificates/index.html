<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates · Aymane Idrissi Khamlichi</title>
<meta name="description" content="Certificates earned by Aymane Idrissi Khamlichi in AI, data, cloud and design.">
<style>
  :root {
    --bg: #ffffff; --card: #f6f8fa; --border: #d0d7de; --text: #1f2328; --muted: #59636e;
    --shadow: 0 1px 2px rgba(31,35,40,.06), 0 10px 30px rgba(31,35,40,.08);
    --shadow-hi: 0 2px 4px rgba(31,35,40,.08), 0 24px 60px rgba(31,35,40,.18);
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --card: #151b23; --border: #30363d; --text: #f0f6fc; --muted: #9198a1;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
      --shadow-hi: 0 2px 4px rgba(0,0,0,.5), 0 28px 70px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  a { color: inherit; }

  header, footer { max-width: 1180px; margin: 0 auto; padding: 28px 24px; }
  .back { font-size: 14px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--text); }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin: 48px 0 18px; font-size: 12px;
             letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .eyebrow::before { content: ""; width: 26px; height: 1px; background: currentColor; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 6vw, 64px); letter-spacing: -.02em; margin: 0; }
  .sub { margin: 14px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
  .hint { margin-top: 6px; font-size: 13px; color: var(--muted); opacity: .8; }

  .stage { perspective: 1600px; max-width: 1180px; margin: 24px auto 40px; padding: 24px; }
  .wall { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; transform-style: preserve-3d; will-change: transform; }
  .card { transform-style: preserve-3d; will-change: transform; }
  .inner {
    display: block; width: 100%; padding: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: var(--card); box-shadow: var(--shadow); cursor: zoom-in; text-align: left; color: inherit; font: inherit;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s, opacity .35s, filter .35s;
    /* backwards fill: hidden during the delay, then plain styles take over so hover can transform it */
    animation: pop .7s cubic-bezier(.2,.9,.25,1.25) backwards; animation-delay: var(--d);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.86); } }
  .inner img { display: block; width: 100%; aspect-ratio: 1.42; object-fit: cover; background: var(--bg); border-bottom: 1px solid var(--border); }
  .meta { padding: 12px 14px 14px; }
  .title { font-family: var(--serif); font-size: 16px; line-height: 1.3; }
  .by { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .by time { font-family: var(--mono); font-size: 12px; }

  /* Hover: the card comes forward, the rest step back. */
  .wall.focus .inner { opacity: .45; filter: saturate(.6); }
  .wall.focus .card.on .inner { opacity: 1; filter: none; transform: translateZ(90px) scale(1.14); box-shadow: var(--shadow-hi); }
  .card.on { position: relative; z-index: 2; }
  .inner:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; max-width: min(960px, 92vw);
           background: var(--card); color: var(--text); box-shadow: var(--shadow-hi); }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(4px); }
  dialog[open] { animation: zoom .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes zoom { from { opacity: 0; transform: scale(.94); } }
  dialog img { display: block; width: 100%; height: auto; }
  .dbar { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .dbar .title { font-size: 19px; }
  .dbar .by { margin: 4px 0 0; justify-content: flex-start; }
  .dbar .grow { flex: 1; min-width: 0; }
  .btn { font: 500 14px var(--sans); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
         background: var(--bg); color: var(--text); text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }

  footer { color: var(--muted); font-size: 13px; padding-bottom: 48px; }

  @media (max-width: 900px) { .wall { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) {
    header, footer { padding-left: 16px; padding-right: 16px; }
    .stage { padding: 16px; }
    .wall { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .meta { padding: 10px 11px 12px; }
    .title { font-size: 14px; }
    .dbar { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    .inner { animation: none; }
    dialog[open] { animation: none; }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="https://github.com/ikaymane">← github.com/ikaymane</a>
  <div class="eyebrow">Certificates</div>
  <h1 id="count">Certificates</h1>
  <p class="sub" id="issuers"></p>
  <p class="hint">Move your mouse over the wall. Click a certificate to open it.</p>
</header>

<main class="stage" id="stage">
  <div class="wall" id="wall"></div>
</main>

<dialog id="view">
  <img id="v-img" alt="">
  <div class="dbar">
    <div class="grow">
      <div class="title" id="v-title"></div>
      <div class="by"><span id="v-issuer"></span>·<time id="v-date"></time></div>
    </div>
    <a class="btn" id="v-verify" target="_blank" rel="noopener">Verify ↗</a>
    <button class="btn" id="v-close" type="button">Close</button>
  </div>
</dialog>

<footer>Aymane Idrissi Khamlichi · <a href="https://www.linkedin.com/in/ikaymane/">LinkedIn</a> · <a href="https://github.com/ikaymane">GitHub</a></footer>

<script>
(async () => {
  const certs = await fetch('data.json').then(r => r.json());
  const wall = document.getElementById('wall');
  document.getElementById('count').textContent = `${certs.length} certificates`;
  document.getElementById('issuers').textContent = [...new Set(certs.map(c => c.issuer))].join(' · ');

  certs.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    // Each card gets its own depth, so the wall shifts in layers.
    card.dataset.depth = (0.45 + ((i * 37) % 11) / 11 * 0.9).toFixed(2);
    card.innerHTML = `<button class="inner" style="--d:${120 + i * 55}ms" aria-label="Open ${c.title}">
        <img src="${c.img}" alt="${c.title} certificate" loading="lazy">
        <div class="meta"><div class="title">${c.title}</div>
        <div class="by"><span>${c.issuer}</span><time>${c.date}</time></div></div></button>`;
    const btn = card.firstElementChild;
    btn.addEventListener('click', () => open(c));
    card.addEventListener('pointerenter', () => { card.classList.add('on'); wall.classList.add('focus'); });
    card.addEventListener('pointerleave', () => { card.classList.remove('on'); wall.classList.remove('focus'); });
    btn.addEventListener('focus', () => { card.classList.add('on'); wall.classList.add('focus'); });
    btn.addEventListener('blur', () => { card.classList.remove('on'); wall.classList.remove('focus'); });
    wall.appendChild(card);
  });

  // Lightbox
  const view = document.getElementById('view');
  const verify = document.getElementById('v-verify');
  function open(c) {
    document.getElementById('v-img').src = c.img;
    document.getElementById('v-img').alt = `${c.title} certificate`;
    document.getElementById('v-title').textContent = c.title;
    document.getElementById('v-issuer').textContent = c.issuer;
    document.getElementById('v-date').textContent = c.date;
    verify.hidden = !c.verify;
    if (c.verify) verify.href = c.verify;
    view.showModal();
  }
  document.getElementById('v-close').onclick = () => view.close();
  view.addEventListener('click', e => { if (e.target === view) view.close(); });

  // Mouse parallax: the wall tilts and every card drifts by its depth.
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(pointer: fine)').matches;
  if (!fine) document.querySelector('.hint').textContent = 'Tap a certificate to open it.';
  if (calm || !fine) return;
  const cards = [...wall.children];
  let tx = 0, ty = 0, x = 0, y = 0;
  addEventListener('pointermove', e => {
    tx = (e.clientX / innerWidth) * 2 - 1;
    ty = (e.clientY / innerHeight) * 2 - 1;
  });
  document.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
  (function tick() {
    x += (tx - x) * 0.07;
    y += (ty - y) * 0.07;
    wall.style.transform = `rotateX(${(-y * 5).toFixed(3)}deg) rotateY(${(x * 7).toFixed(3)}deg)`;
    for (const card of cards) {
      const d = +card.dataset.depth;
      card.style.transform = `translate3d(${(-x * 26 * d).toFixed(2)}px, ${(-y * 18 * d).toFixed(2)}px, ${(d * 24).toFixed(1)}px)`;
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
